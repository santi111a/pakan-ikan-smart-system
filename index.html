<div class="input-group">
    <label>Waktu Pakan Pagi (Jam : Menit)</label>
    <div style="display: flex; gap: 10px;">
        <input type="number" id="jam-pagi" placeholder="Jam (0-23)">
        <input type="number" id="menit-pagi" placeholder="Menit (0-59)">
    </div>
</div>

<button class="btn-update" onclick="updateJadwal()">UPDATE JADWAL</button>

<script>
// Di dalam fungsi updateJadwal(), tambahkan variabel menit:
function updateJadwal() {
    const j1 = document.getElementById('jam-pagi').value;
    const m1 = document.getElementById('menit-pagi').value;
    const dur = document.getElementById('durasi').value;

    db.ref('/').update({
        jam_pagi: parseInt(j1),
        menit_pagi: parseInt(m1),
        durasi_detik: parseInt(dur)
    }).then(() => alert("Jadwal Diperbarui!"));
}
</script>
