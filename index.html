<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santi Smart Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh; align-items: center; }
        .card { background: #1e293b; padding: 30px; border-radius: 30px; width: 100%; max-width: 380px; border-top: 6px solid #38bdf8; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; color: #38bdf8; margin-bottom: 5px; font-weight: 700; }
        p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; letter-spacing: 1px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: 600; letter-spacing: 0.5px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: none; background: #0f172a; color: #38bdf8; font-weight: bold; box-sizing: border-box; font-size: 16px; text-align: center; }
        input::placeholder { color: #334155; }
        .flex-row { display: flex; gap: 12px; align-items: center; }
        .divider { color: #38bdf8; font-weight: bold; font-size: 20px; }
        .btn-update { background: #22c55e; color: #0f172a; border: none; width: 100%; padding: 18px; font-weight: 800; border-radius: 15px; cursor: pointer; margin-top: 15px; font-size: 16px; text-transform: uppercase; transition: 0.3s; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }
        .btn-update:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Pakan Ikan Pintar</h1>
        <p class="subtitle">Santi Smart System v3.0</p>
        
        <div class="input-group">
            <label>Rentang Tanggal (Mulai - Selesai)</label>
            <div class="flex-row">
                <input type="number" id="tgl-start" placeholder="Tgl 1">
                <input type="number" id="tgl-end" placeholder="Tgl 31">
            </div>
        </div>

        <div class="input-group">
            <label>Jadwal Pagi (Jam : Menit)</label>
            <div class="flex-row">
                <input type="number" id="jam-pagi" placeholder="07">
                <span class="divider">:</span>
                <input type="number" id="menit-pagi" placeholder="15">
            </div>
        </div>

        <div class="input-group">
            <label>Jadwal Sore (Jam : Menit)</label>
            <div class="flex-row">
                <input type="number" id="jam-sore" placeholder="17">
                <span class="divider">:</span>
                <input type="number" id="menit-sore" placeholder="30">
            </div>
        </div>

        <div class="input-group">
            <label>Durasi Pakan (Detik)</label>
            <input type="number" id="durasi" placeholder="8">
        </div>

        <button class="btn-update" onclick="updateJadwal()">Update Data & Aktifkan</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://pakan-ikan-pintar-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Ambil data otomatis saat web dibuka
        db.ref('/').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('tgl-start').value = data.start_date || "";
                document.getElementById('tgl-end').value = data.end_date || "";
                document.getElementById('jam-pagi').value = data.jam_pagi || 0;
                document.getElementById('menit-pagi').value = data.menit_pagi || 0;
                document.getElementById('jam-sore').value = data.jam_sore || 0;
                document.getElementById('menit-sore').value = data.menit_sore || 0;
                document.getElementById('durasi').value = data.durasi_detik || 0;
            }
        });

        function updateJadwal() {
            const dataUpdate = {
                start_date: parseInt(document.getElementById('tgl-start').value),
                end_date: parseInt(document.getElementById('tgl-end').value),
                jam_pagi: parseInt(document.getElementById('jam-pagi').value),
                menit_pagi: parseInt(document.getElementById('menit-pagi').value),
                jam_sore: parseInt(document.getElementById('jam-sore').value),
                menit_sore: parseInt(document.getElementById('menit-sore').value),
                durasi_detik: parseInt(document.getElementById('durasi').value)
            };

            db.ref('/').update(dataUpdate).then(() => {
                alert("🚀 Berhasil! Jadwal telah sinkron ke alat.");
            }).catch((e) => alert("Gagal: " + e.message));
        }
    </script>
</body>
</html>
